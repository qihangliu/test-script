# ====================================================================
# Jenkins Configuration as Code - 最终精简版
#
# 仍需您关注:
# 1. [重要] `jenkins.authorizationStrategy`: 当前设置为 `loggedInUsersCanDoAnything`，
#    任何登录用户都有管理员权限，建议在生产环境中更换为更严格的策略。
# 2. `credentials`: 请定期审计，确保所有凭据都在被积极使用，及时移除废弃的凭据。
# 3. `unclassified.pollSCM`: 由于禁用了 Webhook，构建触发可能依赖此轮询配置。
#    请检查其中的 `pollingThreadCount` 是否符合您的性能预期。
# ====================================================================

